<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Sofa Upholstery">
  <defs>
    <linearGradient id="bg-ponnqr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a13"/>
      <stop offset="1" stop-color="#1a3a2a"/>
    </linearGradient>
    <filter id="grain-ponnqr" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg-ponnqr)"/>

  <!-- measuring-paper grid -->
  <g stroke="undefined" stroke-opacity="0.14" stroke-width="1">
    <path d="M0 0V800"/><path d="M60 0V800"/><path d="M120 0V800"/><path d="M180 0V800"/><path d="M240 0V800"/><path d="M300 0V800"/><path d="M360 0V800"/><path d="M420 0V800"/><path d="M480 0V800"/><path d="M540 0V800"/><path d="M600 0V800"/><path d="M660 0V800"/><path d="M720 0V800"/><path d="M780 0V800"/><path d="M840 0V800"/><path d="M900 0V800"/><path d="M960 0V800"/><path d="M1020 0V800"/><path d="M1080 0V800"/><path d="M1140 0V800"/><path d="M1200 0V800"/>
    <path d="M0 0H1200"/><path d="M0 60H1200"/><path d="M0 120H1200"/><path d="M0 180H1200"/><path d="M0 240H1200"/><path d="M0 300H1200"/><path d="M0 360H1200"/><path d="M0 420H1200"/><path d="M0 480H1200"/><path d="M0 540H1200"/><path d="M0 600H1200"/><path d="M0 660H1200"/><path d="M0 720H1200"/><path d="M0 780H1200"/><path d="M0 840H1200"/>
  </g>

  <!-- subject line art -->
  <g transform="translate(269.3333333333333 152) scale(1.6533333333333333)"
     fill="none" stroke="undefined" stroke-width="3.2"
     stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85">
    
    <path d="M64 226h272v22a8 8 0 0 1-8 8H72a8 8 0 0 1-8-8z"/>
    <rect x="64" y="150" width="180" height="76" rx="22"/>
    <rect x="244" y="118" width="92" height="108" rx="26"/>
    <path d="M78 256v16M322 256v16M140 226v30"/>
  </g>

  <!-- stitched inner border -->
  <rect x="22" y="22" width="1156" height="756" rx="10" fill="none"
        stroke="undefined" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="7 9"/>

  <rect width="1200" height="800" filter="url(#grain-ponnqr)" opacity="0.5"/>

  <!-- label -->
  <g font-family="Manrope, Segoe UI, sans-serif">
    <text x="52" y="726" font-size="17" font-weight="700" letter-spacing="3.6"
          fill="undefined" fill-opacity="0.9">ASIAN SOFA · GURUGRAM</text>
    <text x="52" y="756" font-size="25" font-weight="700" letter-spacing="0.2"
          fill="#fbf8f2">Sofa Upholstery</text>
  </g>
</svg>
